name: sreerajp_todo
description: "SreerajP ToDo — Personal offline-first daily ToDo and time-tracker."
publish_to: 'none'
version: 2.3.3+55

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  characters: ^1.4.0
  sqflite_sqlcipher: ^3.1.0
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.2
  fl_chart: ^1.2.0
  table_calendar: ^3.2.0
  uuid: ^4.5.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  unorm_dart: ^0.3.2
  file_picker: ^13.1.0
  rrule: ^0.2.16
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  camera: ^0.12.1
  image_cropper: ^12.2.1
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config/
    - assets/fonts/
    - assets/splash/
    - assets/tessdata/

  fonts:
    - family: Manjari
      fonts:
        - asset: assets/fonts/Manjari-Regular.ttf
        - asset: assets/fonts/Manjari-Bold.ttf
          weight: 700
    - family: Anek Malayalam
      fonts:
        - asset: assets/fonts/AnekMalayalam-Regular.ttf
        - asset: assets/fonts/AnekMalayalam-Bold.ttf
          weight: 700
    - family: Noto Sans Malayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
        - asset: assets/fonts/NotoSansMalayalam-Bold.ttf
          weight: 700

flutter_native_splash:
  color: '#1565C0'
  image: assets/splash/splash_logo.png
  android: true
  ios: false
  web: false
